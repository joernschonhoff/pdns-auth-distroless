services:
  postgres:
    container_name: postgres
    image: postgres:18.6-alpine3.23
    env_file:
      - ./.env.example
    volumes:
      - postgres-data:/var/lib/postgresql/
    networks:
      - pdns-auth-network
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  pdns-auth-init-db:
    container_name: pdns-auth-init-db
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-init-db:5.1.4
    env_file:
      - ./.env.example
    networks:
      - pdns-auth-network
    depends_on:
      postgres:
        condition: service_healthy
  pdns-auth-init-conf:
    container_name: pdns-auth-init-conf
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-init-conf:0.1.0
    env_file:
      - ./.env.example
    volumes:
      - pdns-auth-config:/etc/pdns
    user: 0:0
    depends_on:
      pdns-auth-init-db:
        condition: service_completed_successfully
    networks:
      - pdns-auth-network
  pdns-auth:
    container_name: pdns-auth
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-distroless:5.1.4
    env_file:
      - ./.env.example
    ports:
      - "5353:53"
    volumes:
      - pdns-auth-config:/etc/pdns
    depends_on:
      pdns-auth-init-conf:
        condition: service_completed_successfully
      pdns-auth-init-db:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/dns-healthcheck", "--check-udp", "--check-tcp"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - pdns-auth-network

networks:
  pdns-auth-network:
    driver: bridge

volumes:
  pdns-auth-config:
  postgres-data: